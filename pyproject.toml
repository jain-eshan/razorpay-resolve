[project]
name = "blindspot"
version = "0.1.0"
description = "Razorpay Resolve (developed as Blindspot): Razorpay x ISB AI PM Build Challenge, Track 2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "synth/tests"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# dict(a=1) reads better than a literal when building database rows; "%s" joins are used to build SQL placeholders
ignore = ["C408", "UP031"]
