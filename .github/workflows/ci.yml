name: ci
# A pull request runs once (pull_request). Main runs once after a merge (push). Before this, a PR branch with an open PR ran the whole job twice on every commit.
# A new commit on a PR cancels the older run of that PR. Runs on main are never cancelled, so the failure alert always hears the result.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
      - run: make snapshot
      - run: make test
      - run: make e2e
      - run: make eval
      - run: make lint
