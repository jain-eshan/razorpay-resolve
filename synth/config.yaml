# ---- R4 Zone 1, problems before the payment (contracts-v0.5, additive). Two incidents and five look-alikes that must not alert. ----
# INC-4 is still broken at the snapshot so the founder can watch the fix land. Dates differ from SPEC 13.2 so the 24 hour WhatsApp window is still open.
zone1:
  pay_url: "https://kaksha.example/buy"
  probe_every_minutes: 5
  probe_flake_rate: 0.002          # a single failed check now and then. Two in a row are needed to raise anything.
  inc4:                            # ad links return 404 after a route rename
    onset: "2026-10-01T20:08:00"
    suppress_share: 0.75           # share of visitors who never get as far as creating an order
    pay_trouble_complaints: 12
    content_questions: 2
    channels: {whatsapp_payments: 7, email: 4, ig_dm: 3}   # across all 14 messages
    paid_since: 1                  # one complainer got through another way
  inc5:                            # key rotated: the page loads, checkout will not open
    onset: "2026-09-28T11:00:00"
    end: "2026-09-28T12:30:00"
    extra_orders: 11               # ad spend sends more visitors than usual
    complaints: 4
  n1: {start: "2026-09-27T03:00:00", end: "2026-09-27T05:00:00"}                                   # a quiet Sunday night
  n2: {start: "2026-09-22T18:00:00", end: "2026-09-22T20:00:00", drop_share: 0.30}                 # an ordinary evening dip
  n3: {start: "2026-09-23T19:00:00", end: "2026-09-23T19:45:00", complaints: 5}                    # questions about the course, not about paying
  n4: {start: "2026-09-27T19:00:00", end: "2026-09-27T19:20:00", failed_customers: 5, complaints: 4}   # a bank outage: real failed payments
  n5: {start: "2026-09-26T17:00:00", end: "2026-09-26T21:00:00", extra_orders_per_hour: 12, complaints: 4}   # a sale: more orders, a few failed payments
  recovery:                        # how simulated customers behave once a link arrives (synthetic, labelled)
    pay_with_link: 0.55
    pay_without_link: 0.10
    max_delay_hours: 36
# ---- INC-3, Razorpay-side card renewal failures (contracts-v0.8, additive). Sits before the INC-1 deploy, so the merchant's webhook was healthy. ----
# Dates differ from SPEC 13.2 (Thu 1 Oct): that window falls inside the INC-1 outage and would turn ordinary renewals into INC-1 victims.
inc3:
  start: "2026-09-29T02:10:00"
  end: "2026-09-29T09:30:00"
  card_failures: 26             # every card mandate renewal due in the window fails
  card_paid_since: 3            # customers who paid again on their own later (left out of the incident)
  card_ok_after: 6              # card renewals that work once it clears
  upi_ok_during: 10             # UPI AutoPay renewals in the same hours, which go through
  complaints: 3
  recovery:                     # how simulated customers behave once their renewal link arrives (synthetic, labelled; contracts-v0.10, additive)
    pay_with_link: 0.60
    pay_without_link: 0.15
    max_delay_hours: 36
  error: {code: GATEWAY_ERROR, description: "Payment processing failed due to error at bank or wallet gateway", source: gateway, step: payment_authorization, reason: gateway_technical_error}
# ---- INC-2, customers charged twice after an Android release (contracts-v0.9, additive). Times avoid the INC-1 outage and every Zone 1 window, and stay in the early afternoon so INC-4's and INC-5's baselines do not move. ----
inc2:
  release: {id: me_app_341, label: "android-3.4.1", at: "2026-09-26T10:00:00"}
  windows:                         # when double taps happen: the days after the release, away from the INC-1 outage (Tue 14:20 to Thu 13:00) and before the INC-4 pay page outage (Thu 20:08 on), which must keep its own story
    - ["2026-09-26T10:30:00", "2026-09-29T14:00:00"]
    - ["2026-10-01T13:00:00", "2026-10-01T20:00:00"]
  duplicates: {plan_mock_199: 10, plan_series_599: 5}   # 15 pairs. Rs 4,985 to refund, just under the default daily cap of Rs 5,000
  legit_two_seat: 3                # a second seat for a friend: two orders, two people, both fulfilled
  reversing: 2                     # the second attempt failed after the bank debited it, so the bank reverses it by itself
  adoption: 0.7                    # share of Android orders after the release that come from the new version. Existing orders are relabelled, none are added
  complaints: 4
  gap_seconds: [3, 90]
  reversal_error: {code: GATEWAY_ERROR, description: "Payment failed after the bank debited the account. The bank reverses it automatically", source: bank, step: payment_authorization, reason: debit_reversal_pending}
